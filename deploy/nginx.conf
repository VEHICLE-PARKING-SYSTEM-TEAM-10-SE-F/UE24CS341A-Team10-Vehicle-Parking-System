# Nginx for the Vehicle Parking System (SAD v1.1 §3.10 deployment view).
# - Terminates TLS (SEC-04: TLS 1.2 or higher only) and redirects HTTP to HTTPS.
# - Serves the React build and forwards /api/v1 to the Express API (PM2) on port 5000.
# Replace parking.example.com and the certificate paths with your own (e.g. from Let's Encrypt).

server {
    listen 80;
    server_name parking.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name parking.example.com;

    ssl_certificate     /etc/letsencrypt/live/parking.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parking.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/vps/client/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100k;
    }

    # Single-page app: unknown paths load index.html.
    location / {
        try_files $uri /index.html;
    }
}
